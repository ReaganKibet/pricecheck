name: Collect prices

# Daily: re-read the prices of products we already know (light on store sites).
# Mondays: also look for new products in each store's sitemap.
# A run that fails or looks unhealthy fails this job, and GitHub emails you.
on:
  schedule:
    - cron: "17 3 * * *"   # 06:17 Nairobi, every day: refresh
    - cron: "43 4 * * 1"   # 07:43 Nairobi, Mondays: discover new products
  workflow_dispatch:
    inputs:
      source:
        description: "Source name from scrapers/sources.json (blank = all enabled)"
        required: false
        default: ""
      mode:
        description: "refresh = known products, discover = find new ones"
        type: choice
        options: [refresh, discover]
        default: refresh
      dry_run:
        description: "Print what would be sent, send nothing"
        type: boolean
        default: false

concurrency:
  group: collect-prices
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the connectors
        run: python -m unittest discover -s tests

      - name: Collect prices
        env:
          PRICE_API_URL: ${{ secrets.PRICE_API_URL }}
          PRICE_API_KEY: ${{ secrets.PRICE_API_KEY }}
          MANUAL_SHEET_CSV_URL: ${{ secrets.MANUAL_SHEET_CSV_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          INPUT_SOURCE: ${{ github.event.inputs.source }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MODE="${INPUT_MODE:-refresh}"
          if [ "$SCHEDULE" = "43 4 * * 1" ]; then MODE=discover; fi
          ARGS=(--mode "$MODE")
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "$INPUT_SOURCE" ]; then
            python -m pricecheck_connectors run "$INPUT_SOURCE" "${ARGS[@]}"
          else
            python -m pricecheck_connectors run --all "${ARGS[@]}"
          fi
